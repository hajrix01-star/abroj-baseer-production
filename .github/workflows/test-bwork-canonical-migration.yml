name: BWork canonical migration rehearsal (explicitly authorized only)

# Prepared source, NOT executed acceptance. The owner deferred native/database
# execution on 2026-10-20. Dispatch requires separate authorization at the exact
# reviewed source ref; do not turn this into an automatic source-PR database job.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-migration:
    name: BWork real legacy upgrade and paired recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute fixed synthetic old-source, upgrade, late-failure and recovery probes
        shell: bash
        env:
          BWORK_CANONICAL_SYNTHETIC: '1'
        run: |
          set -Eeuo pipefail
          bash ops/tests/run-bwork-canonical-ci.sh 2>&1 | tee bwork-canonical-driver.log
          grep -Fx 'BCR_NATIVE_UPGRADE_GO' bwork-canonical-driver.log
          grep -Fx 'BCR_FRESH_NEXT_UPGRADE_GO' bwork-canonical-driver.log
          grep -Fx 'BCR_PAIRED_BACKUP_RECOVERY_GO' bwork-canonical-driver.log
      - name: Preserve evidence, including an unsuccessful rehearsal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bwork-canonical-migration
          path: |
            bwork-canonical-driver.log
            output/bwork-canonical-rename-20261020/native-ci.*/**
          if-no-files-found: error
