name: BChat cumulative contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'custom_addons/baseer_bchat/**'
      - 'android/bchat/**'
      - 'ops/qa/baseer-qa-deploy'
      - 'ops/production/baseer-production-deploy'
      - '.github/workflows/validate-pull-request.yml'
      - '.github/CODEOWNERS'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: BChat cumulative contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the pinned media contract dependency
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes
          -r custom_addons/baseer_bchat/tests_contract/requirements-ci.txt

      - name: Validate cumulative contracts and their named suites
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 custom_addons/baseer_bchat/tools/release_guard.py --changed "$BASE_SHA" "$HEAD_SHA"
          else
            python3 custom_addons/baseer_bchat/tools/release_guard.py --all
          fi
