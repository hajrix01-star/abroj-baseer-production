name: Validate pull request source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-integrity:
    name: Source integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the pinned BWork media contract dependency
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes
          -r custom_addons/baseer_bwork/tests_contract/requirements-ci.txt

      - name: Reject whitespace errors and validate changed source
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          for path in "${changed[@]}"; do
            [ -f "$path" ] || continue
            case "$path" in
              ops/production/baseer-production-*|ops/production/upgrade-zatca-approve-wrapper.sh|ops/qa/baseer-qa-*|ops/qa/install-qa-release-poller.sh) bash -n "$path" ;;
              .github/workflows/*.yml) ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: false)' "$path" ;;
            esac
          done
          if printf '%s\n' "${changed[@]}" | grep -q '^ops/qa/'; then
            bash ops/qa/verify-qa-deploy-source.sh
          fi
          if printf '%s\n' "${changed[@]}" | grep -q '^ops/production/'; then
            sudo python3 -m unittest discover -s ops/production/tests -v
            bash ops/production/test-zatca-bootstrap-snapshot.sh
          fi
          if printf '%s\n' "${changed[@]}" | grep -Eq '^(custom_addons/(baseer_b(chat|work)(_(admin|procurement|permission_guards|document_permission_guards|dashboard))?)/|mobile/(chatwoot|bwork)/|android/(bchat|bwork-legacy)/|ops/(lib/bwork_(release_source|recovery).py|tests/test_bwork_(release_source|recovery[^/]*).py|qa/baseer-qa-deploy|production/(baseer-production-deploy|(test-)?upgrade-bwork-deploy-wrapper.sh))$|\.github/workflows/(validate-pull-request|b(chat|work)-cumulative-contracts|test-bwork-admin|test-bwork-gallery|test-bwork-retention)\.yml$|\.github/CODEOWNERS$)'; then
            python3 custom_addons/baseer_bwork/tools/release_guard.py --changed "$BASE_SHA" "$HEAD_SHA"
          fi
          python3 - "$BASE_SHA" "$HEAD_SHA" <<'PY'
          import ast
          import os
          import subprocess
          import sys
          import xml.etree.ElementTree as etree

          base, head = sys.argv[1:]
          paths = subprocess.check_output(
              ["git", "diff", "--name-only", base, head], text=True
          ).splitlines()
          for path in paths:
              # A valid source change may delete a Python or XML file.  There
              # is no working-tree file to parse in that case.
              if not os.path.exists(path):
                  continue
              if path.endswith(".py"):
                  with open(path, encoding="utf-8") as source:
                      ast.parse(source.read(), filename=path)
              elif path.endswith(".xml"):
                  etree.parse(path)
          print(f"validated {len(paths)} changed paths")
          PY
