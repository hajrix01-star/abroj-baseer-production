name: Test Abroj contracting in isolated Odoo
on:
  pull_request:
    branches: [main]
    paths:
      - 'custom_addons/abroj_contracting/**'
      - '.github/workflows/test-abroj-contracting.yml'
permissions:
  contents: read
jobs:
  contracting-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Contracting balances, security, issue flow and webhook
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network host \
            -e HOST=127.0.0.1 -e USER=odoo -e PASSWORD=odoo \
            -e PGOPTIONS='-c lock_timeout=5000 -c statement_timeout=30000' \
            --mount type=bind,src="$GITHUB_WORKSPACE/custom_addons",dst=/mnt/baseer-addons,readonly \
            odoo@sha256:f99ffac95cb39a0924622ea4118481c95651d9c84187e5b30a21c2cc4419c7dd \
            odoo --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/baseer-addons \
            -d abroj_contracting_ci -i abroj_contracting --without-demo=all \
            --test-enable \
            --test-tags=/abroj_contracting:AbrojContractingCase \
            --stop-after-init --max-cron-threads=0 --workers=0 --log-level=test 2>&1 | tee abroj-contracting-runtime.log
          for test_class in AbrojContractingCase; do
            grep -F "Starting $test_class." abroj-contracting-runtime.log
          done
          if grep -Eq ': skipped .+ : |[1-9][0-9]* failed,|[1-9][0-9]* error\(s\)' abroj-contracting-runtime.log; then
            echo 'Contracting runtime tests were skipped or failed' >&2
            exit 1
          fi
          grep -F '0 failed, 0 error(s)' abroj-contracting-runtime.log
          test "$(grep -Ec 'Starting AbrojContractingCase\.' abroj-contracting-runtime.log)" -eq 37
      - name: Preserve contracting runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abroj-contracting-runtime
          path: abroj-contracting-runtime.log
          if-no-files-found: error
