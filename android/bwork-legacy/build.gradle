buildscript {
 // Only Firebase builds resolve Google tooling; no-Firebase builds stay offline.
 def bworkPushBuild = file('app/google-services.json').exists()
         && gradle.startParameter.projectProperties['bworkEnablePush'] == 'true'
 if (bworkPushBuild) {
  repositories { google(); mavenCentral() }
  dependencies { classpath 'com.google.gms:google-services:4.5.0' }
 }
}
plugins { id 'com.android.application' version '8.9.2' apply false }
