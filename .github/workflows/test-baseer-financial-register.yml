name: Test Baseer financial register

on:
  pull_request:
    branches: [main]
    paths:
      - 'custom_addons/baseer_financial_register/**'
      - '.github/workflows/test-baseer-financial-register.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  odoo-register-tests:
    name: Odoo 19 financial register tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install the register and test default views
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network host \
            -e HOST=127.0.0.1 -e USER=odoo -e PASSWORD=odoo \
            --mount type=bind,src="$GITHUB_WORKSPACE/custom_addons",dst=/mnt/baseer-addons,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/third_party_addons/erp_heritage_19",dst=/mnt/heritage-addons,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/third_party_addons/odoomates_19",dst=/mnt/payroll-addons,readonly \
            odoo@sha256:f99ffac95cb39a0924622ea4118481c95651d9c84187e5b30a21c2cc4419c7dd \
            odoo --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/baseer-addons,/mnt/heritage-addons,/mnt/payroll-addons \
            -d baseer_financial_register_ci -i baseer_financial_register --without-demo=all \
            --test-enable --test-tags=/baseer_financial_register:BaseerFinancialRegisterDefaultViewsCase \
            --stop-after-init --max-cron-threads=0 --workers=0 --log-level=test 2>&1 | tee baseer-financial-register.log
          grep -F 'Starting BaseerFinancialRegisterDefaultViewsCase.' baseer-financial-register.log
          if grep -Eq ': skipped .+ : |[1-9][0-9]* failed,|[1-9][0-9]* error\(s\)' baseer-financial-register.log; then
            echo 'Financial register tests were skipped or failed' >&2
            exit 1
          fi
          grep -F '0 failed, 0 error(s)' baseer-financial-register.log
