name: Baseer Hostinger Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify checks the runner only; deploy performs the guarded release"
        required: true
        default: verify
        type: choice
        options: [verify, deploy]
      release_ref:
        description: "Immutable Git commit to deploy"
        required: true
        default: 0dd7f7ab7d8a432a493683d4da0307e9f21c4b62

permissions:
  contents: read

jobs:
  release:
    name: Guarded Hostinger release
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 1

      - name: Verify the intended Hostinger release surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.release_ref }}"
          test -d /srv/abroj-baseer-production
          test -L /srv/abroj-baseer-production/current
          test -d /srv/abroj-baseer-production/current/custom_addons
          test -d custom_addons/baseer_native_spend
          docker ps --format '{{.Names}}' | grep -Fx baseer-odoo-prod-db-1
          echo "Runner verification passed for ${GITHUB_SHA}."

      - name: Stop after verification
        if: ${{ inputs.mode == 'verify' }}
        run: echo "Verification-only run complete; production was not changed."

      # The deployment step is intentionally introduced only after this
      # runner proof succeeds.  It will preserve the same backup, protected
      # snapshot and atomic-symlink safeguards as the previous manual path.
      - name: Deployment placeholder
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          echo "Deployment is intentionally disabled until the runner proof is accepted."
          exit 1
