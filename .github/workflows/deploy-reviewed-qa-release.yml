name: Deploy a reviewed Baseer Odoo QA release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: QA release identifier committed under ops/qa/release-policies
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_QA to approve and deploy the named QA release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: baseer-qa
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'DEPLOY_QA'
    # The QA host is reachable only on its private network.  This restricted
    # runner lives on that QA host; it never receives a production label.
    runs-on: [self-hosted, linux, baseer-qa]
    timeout-minutes: 30
    environment:
      name: qa
    steps:
      - name: Validate the bounded QA release identifier
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_ID" =~ ^[a-z0-9][a-z0-9-]{2,63}$ ]]

      - name: Store the reviewed QA policy on the QA host
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -Eeuo pipefail
          sudo -n /usr/local/sbin/baseer-qa-approve-release \
            "$RELEASE_ID" "$GITHUB_RUN_ID" "$GITHUB_SHA"

      - name: Deploy only the approved QA release
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -Eeuo pipefail
          sudo -n /usr/local/sbin/baseer-qa-deploy "$RELEASE_ID" "$GITHUB_RUN_ID"
