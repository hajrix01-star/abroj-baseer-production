services:
  abroj_preview:
    image: odoo@sha256:f99ffac95cb39a0924622ea4118481c95651d9c84187e5b30a21c2cc4419c7dd
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - odoo
      - --config=/etc/odoo/odoo.local.conf
      - --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/baseer-addons
      - --database=abroj_preview
      - --db-filter=^abroj_preview$
      - --no-database-list
      - -u
      - abroj_website,baseer_abroj_login
    ports:
      - "127.0.0.1:18080:8069"
    volumes:
      - ./config/odoo.local.conf:/etc/odoo/odoo.local.conf:ro
      - ./custom_addons:/mnt/baseer-addons:ro
