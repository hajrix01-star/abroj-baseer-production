services:
  reports_qa:
    image: odoo@sha256:f99ffac95cb39a0924622ea4118481c95651d9c84187e5b30a21c2cc4419c7dd
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - odoo
      - --config=/etc/odoo/odoo.local.conf
      - --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/baseer-addons,/mnt/third-party-addons/erp_heritage_19,/mnt/third-party-addons/odoomates_19
      - --database=baseer_reports_qa_20260907
      - --db-filter=^baseer_reports_qa_20260907$
      - --no-database-list
      - --max-cron-threads=0
    ports:
      - '127.0.0.1:18070:8069'
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config/odoo.local.conf:/etc/odoo/odoo.local.conf:ro
      - ./custom_addons:/mnt/baseer-addons:ro
      - ./third_party_addons:/mnt/third-party-addons:ro
      - ./docs/build-governance:/mnt/qa-evidence
    restart: 'no'
