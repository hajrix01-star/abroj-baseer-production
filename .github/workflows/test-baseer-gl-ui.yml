name: Test Baseer general ledger UI

on:
  pull_request:
    branches: [main]
    paths:
      - custom_addons/baseer_general_ledger_report/**
      - custom_addons/baseer_reports_menu/**
      - .github/workflows/test-baseer-gl-ui.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hoot-report-tests:
    name: Odoo 19 Hoot report tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify the runner's headless Chrome
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v google-chrome
          google-chrome --version
      - name: Install the pinned Odoo 19 package
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --silent --show-error \
            https://nightly.odoo.com/19.0/nightly/deb/odoo_19.0.20260926_all.deb \
            --output "$RUNNER_TEMP/odoo_19.0.20260926_all.deb"
          printf '%s  %s\n' \
            cb9d876779edc8d5f0394ddd3936a387e349077c \
            "$RUNNER_TEMP/odoo_19.0.20260926_all.deb" | sha1sum --check
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "$RUNNER_TEMP/odoo_19.0.20260926_all.deb"
          sudo apt-get install -y --no-install-recommends python3-websocket
          /usr/bin/python3 -c 'import websocket; print(websocket.__version__)'
          odoo --version
      - name: Run General Ledger Hoot and real action scroll tests at desktop and 375px
        shell: bash
        run: |
          set -Eeuo pipefail
          odoo --db_host=127.0.0.1 --db_port=5432 \
            --db_user=odoo --db_password=odoo \
            --http-interface=127.0.0.1 --http-port=8079 \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,"$GITHUB_WORKSPACE/custom_addons" \
            -d baseer_gl_ui_ci -i baseer_general_ledger_report --without-demo=all \
            '--test-tags=/web:WebSuite.test_unit_desktop[@baseer_general_ledger_report/general_ledger],/web:MobileWebSuite.test_unit_mobile[@baseer_general_ledger_report/general_ledger],/baseer_reports_menu:TestHubScroll.test_real_client_action_owns_vertical_scroll,/baseer_reports_menu:TestHubScrollMobile.test_real_client_action_owns_vertical_scroll' \
            --stop-after-init --max-cron-threads=0 --workers=0 --log-level=test \
            2>&1 | tee "$RUNNER_TEMP/baseer-gl-hoot.log"
          test "$(grep -Fc '[HOOT] Test suite succeeded' "$RUNNER_TEMP/baseer-gl-hoot.log")" -ge 2
          grep -Fq '[HOOT] Running test "@baseer_general_ledger_report/general_ledger/' "$RUNNER_TEMP/baseer-gl-hoot.log"
          grep -Fq 'TestHubScroll.test_real_client_action_owns_vertical_scroll' "$RUNNER_TEMP/baseer-gl-hoot.log"
          grep -Fq 'TestHubScrollMobile.test_real_client_action_owns_vertical_scroll' "$RUNNER_TEMP/baseer-gl-hoot.log"
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseer-general-ledger-ui-diagnostics
          path: |
            ${{ runner.temp }}/baseer-gl-hoot.log
            /tmp/odoo_tests/baseer_gl_ui_ci/screenshots/
          retention-days: 7
