name: Test procurement purchase routes
on:
  pull_request:
    branches: [main]
    paths:
      - custom_addons/baseer_procurement_requests/**
      - custom_addons/baseer_bwork_procurement/**
      - custom_addons/baseer_bwork/**
      - custom_addons/baseer_access_roles/**
      - tests/purchase_route_catalog.test.mjs
      - .github/workflows/test-baseer-procurement-route.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bwork-orders-workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify BWork order permissions, HTTP, atomic sharing and receipts in isolated Odoo
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network host \
            -e HOST=127.0.0.1 -e USER=odoo -e PASSWORD=odoo \
            --mount type=bind,src="$GITHUB_WORKSPACE/custom_addons",dst=/mnt/baseer-addons,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/third_party_addons/odoomates_19",dst=/mnt/odoomates,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/third_party_addons/erp_heritage_19",dst=/mnt/erp-heritage,readonly \
            odoo@sha256:f99ffac95cb39a0924622ea4118481c95651d9c84187e5b30a21c2cc4419c7dd \
            odoo --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/baseer-addons,/mnt/odoomates,/mnt/erp-heritage \
            -d bwork_orders_workflow_ci -i baseer_bwork_procurement,baseer_access_roles --without-demo=all \
            --test-enable \
            --test-tags=/baseer_bwork_procurement:BWorkOrderCase,/baseer_bwork_procurement:BWorkOrderHttpCase,/baseer_bwork_procurement:BWorkReceiptCase,/baseer_bwork_procurement:BWorkUserPermissionsCase \
            --stop-after-init --max-cron-threads=0 --workers=0 --log-level=test 2>&1 | tee bwork-orders-workflow.log
          for test_class in BWorkOrderCase BWorkOrderHttpCase BWorkReceiptCase BWorkUserPermissionsCase; do
            grep -F "Starting $test_class." bwork-orders-workflow.log
          done
          # OdooTestResult.addSkip emits ': skipped <description> : <reason>'.
          # Do not mistake benign config/translation 'skipped' notices for tests.
          if grep -Eq ': skipped .+ : |[1-9][0-9]* failed,|[1-9][0-9]* error\(s\)' bwork-orders-workflow.log; then
            echo 'BWork orders runtime tests were skipped or failed' >&2
            exit 1
          fi
          grep -F '0 failed, 0 error(s)' bwork-orders-workflow.log
      - name: Preserve isolated Odoo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bwork-orders-workflow-runtime
          path: bwork-orders-workflow.log
          if-no-files-found: error
  purchase-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify catalogue route methods
        run: node --test tests/purchase_route_catalog.test.mjs
      - name: Verify isolated request routes and unchanged legacy accounting boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network host \
            -e HOST=127.0.0.1 -e USER=odoo -e PASSWORD=odoo \
            --mount type=bind,src="$GITHUB_WORKSPACE/custom_addons",dst=/mnt/baseer-addons,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/third_party_addons/odoomates_19",dst=/mnt/odoomates,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/third_party_addons/erp_heritage_19",dst=/mnt/erp-heritage,readonly \
            odoo@sha256:f99ffac95cb39a0924622ea4118481c95651d9c84187e5b30a21c2cc4419c7dd \
            odoo --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/baseer-addons,/mnt/odoomates,/mnt/erp-heritage \
            -d baseer_procurement_route_ci -i baseer_procurement_requests,baseer_access_roles --without-demo=all \
            --test-enable \
            --test-tags=/baseer_procurement_requests:ProcurementFlowCase.test_purchase_route_direct_catalog_save_send_without_accounting,/baseer_procurement_requests:ProcurementFlowCase.test_purchase_route_representative_legacy_fingerprint_and_validation,/baseer_procurement_requests:ProcurementFlowCase.test_purchase_route_orm_constraint_and_readonly_accountant_annotation,/baseer_procurement_requests:ProcurementFlowCase.test_pos_catalog_page_quote_and_idempotent_create,/baseer_procurement_requests:ProcurementFlowCase.test_catalog_representative_is_company_scoped_and_creates_request,/baseer_procurement_requests:ProcurementFlowCase.test_quantity_receipt_creates_one_picking_and_price_history,/baseer_procurement_requests:ProcurementFlowCase.test_completed_receipt_creates_one_non_accounting_invoice_draft,/baseer_procurement_requests:ProcurementFlowCase.test_completed_representative_receipt_uses_invoice_level_settlement,/baseer_procurement_requests:ProcurementFlowCase.test_purchase_batch_exposes_received_total_invoice_difference_and_match,/baseer_access_roles:CashierProcurementRoleCase.test_cpr_t00c_accountant_can_enter_purchase_batches_but_not_operational_requests \
            --stop-after-init --max-cron-threads=0 --workers=0 --log-level=test
