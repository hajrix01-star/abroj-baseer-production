name: BWork cumulative contracts

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-contracts:
    name: BWork mobile identity and cumulative contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: '10.11.0'
          run_install: false
          package_json_file: mobile/bwork/package.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: '9.3.1'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platforms;android-36'
          log-accepted-android-sdk-licenses: false
      - name: Restore unchanged locked JavaScript dependencies
        run: pnpm --dir mobile/bwork install --frozen-lockfile
      - name: Resolve only the pinned public native test SDKs
        run: gradle -p mobile/bwork/native/sdk-resolver prepareNativeProof --no-daemon
      - name: Execute every protected mobile invariant and real JVM adapter
        run: |
          set -Eeuo pipefail
          pnpm --dir mobile/bwork check:bwork
          pnpm --dir mobile/bwork test:native-session

  contracts:
    name: BWork cumulative contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the pinned media contract dependency
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes
          -r custom_addons/baseer_bwork/tests_contract/requirements-ci.txt

      - name: Validate cumulative contracts and their named suites
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 custom_addons/baseer_bwork/tools/release_guard.py --changed "$BASE_SHA" "$HEAD_SHA"
          else
            python3 custom_addons/baseer_bwork/tools/release_guard.py --all
          fi

      - name: Run native media controller on pinned Odoo HTTPRequest
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --entrypoint python3 -e PYTHONDONTWRITEBYTECODE=1 \
            --mount type=bind,src="$GITHUB_WORKSPACE/custom_addons/baseer_bwork",dst=/mnt/baseer-addons/baseer_bwork,readonly \
            odoo@sha256:f99ffac95cb39a0924622ea4118481c95651d9c84187e5b30a21c2cc4419c7dd \
            /mnt/baseer-addons/baseer_bwork/tools/run_native_body_tests.py \
            --addon-root /mnt/baseer-addons/baseer_bwork

  legacy-required-context:
    # Compatibility identity only: main currently requires this exact context.
    # There is one test engine above. Never turn skipped/cancelled tests green.
    name: BChat cumulative contracts
    needs: [contracts, mobile-contracts]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the canonical BWork suite to have actually succeeded
        env:
          CANONICAL_RESULT: ${{ needs.contracts.result }}
          MOBILE_RESULT: ${{ needs.mobile-contracts.result }}
        run: test "$CANONICAL_RESULT" = success && test "$MOBILE_RESULT" = success
