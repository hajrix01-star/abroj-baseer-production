name: Test Baseer general ledger

on:
  pull_request:
    branches: [main]
    paths:
      - custom_addons/baseer_general_ledger_report/**
      - .github/workflows/test-baseer-general-ledger.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  odoo-report-tests:
    name: Odoo 19 general ledger tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install module and run its Odoo tests in an isolated database
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network host \
            -e HOST=127.0.0.1 -e USER=odoo -e PASSWORD=odoo \
            --mount type=bind,src="$GITHUB_WORKSPACE/custom_addons",dst=/mnt/baseer-addons,readonly \
            odoo@sha256:f99ffac95cb39a0924622ea4118481c95651d9c84187e5b30a21c2cc4419c7dd \
            odoo --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/baseer-addons \
            -d baseer_gl_ci -i baseer_general_ledger_report --without-demo=all \
            --test-enable --test-tags=/baseer_general_ledger_report \
            --stop-after-init --max-cron-threads=0 --workers=0 --log-level=test
