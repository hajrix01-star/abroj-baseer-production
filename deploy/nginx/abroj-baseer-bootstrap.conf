# Install this HTTP-only configuration first, obtain the certificate, then
# replace it with abroj-baseer.conf and test Nginx before reload.
server {
    listen 80;
    listen [::]:80;
    server_name abroj.sa www.abroj.sa baseer.abroj.sa;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
