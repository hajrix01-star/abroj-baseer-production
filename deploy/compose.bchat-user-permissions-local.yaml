# Local BChat clone only. Layer after the orders-route overlay.
# Freeze these five add-ons from the reviewed Git commit before startup.
services:
  odoo:
    command: >-
      odoo --config=/etc/odoo/odoo.conf
      --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/baseer-addons,/mnt/bchat-addons,/mnt/bchat-permission-guards,/mnt/oca-dms,/mnt/third-party-addons/erp_heritage_19,/mnt/third-party-addons/odoomates_19
      --database=baseer_bchat_local --db-filter=^baseer_bchat_local$$
      --no-database-list --max-cron-threads=1 --http-port=8069 --proxy-mode
    volumes:
      - ${BCHAT_PERMISSIONS_CANDIDATE_DIR:?Frozen BChat permissions source required}/baseer_bchat:/mnt/bchat-addons/baseer_bchat:ro
      - ${BCHAT_PERMISSIONS_CANDIDATE_DIR:?Frozen BChat permissions source required}/baseer_bchat_procurement:/mnt/bchat-addons/baseer_bchat_procurement:ro
      - ${BCHAT_PERMISSIONS_CANDIDATE_DIR:?Frozen BChat permissions source required}/baseer_procurement_requests:/mnt/baseer-addons/baseer_procurement_requests:ro
      - ${BCHAT_PERMISSIONS_CANDIDATE_DIR:?Frozen BChat permissions source required}/baseer_bchat_permission_guards:/mnt/bchat-permission-guards/baseer_bchat_permission_guards:ro
      - ${BCHAT_PERMISSIONS_CANDIDATE_DIR:?Frozen BChat permissions source required}/baseer_bchat_document_permission_guards:/mnt/bchat-permission-guards/baseer_bchat_document_permission_guards:ro
