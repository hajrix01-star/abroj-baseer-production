name: Queue a reviewed Baseer Odoo QA release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: QA release identifier committed under ops/qa/release-policies
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_QA to approve and deploy the named QA release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: baseer-qa
  cancel-in-progress: false

jobs:
  queue:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'DEPLOY_QA'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: qa
    steps:
      - name: Check out the reviewed main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate the bounded QA release identifier and policy
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_ID" =~ ^[a-z0-9][a-z0-9-]{2,63}$ ]]
          test -f "ops/qa/release-policies/$RELEASE_ID.env"
          bash ops/qa/verify-qa-deploy-source.sh

      - name: Queue the bounded QA deployment request
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          QA_REQUEST_SIGNING_KEY: ${{ secrets.QA_REQUEST_SIGNING_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$QA_REQUEST_SIGNING_KEY"
          request_tag="qa-release-${RELEASE_ID}-${GITHUB_RUN_ID}"
          git config user.name 'baseer-qa-release-bot'
          git config user.email 'baseer-qa-release-bot@users.noreply.github.com'
          signing_key="$RUNNER_TEMP/qa-request-signing-key"
          printf '%s\n' "$QA_REQUEST_SIGNING_KEY" > "$signing_key"
          chmod 0600 "$signing_key"
          git config gpg.format ssh
          git config user.signingkey "$signing_key"
          git tag --sign --message "Reviewed QA release request ${RELEASE_ID}" \
            "$request_tag" "$GITHUB_SHA"
          rm -f -- "$signing_key"
          git push origin "refs/tags/$request_tag"
          printf 'QA_REQUEST=QUEUED\nTAG=%s\n' "$request_tag"
