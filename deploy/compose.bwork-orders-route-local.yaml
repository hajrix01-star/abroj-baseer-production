# Local BWork clone only. Layer after the existing TLS/FCM/OCA/v4 overlays.
# The source is a frozen candidate: three modules from the reviewed Git commit
# plus baseer_company_setup 19.0.3.1.0 matching this clone's installed version.
services:
  odoo:
    volumes:
      - ${BWORK_ORDERS_CANDIDATE_DIR:?Frozen BWork orders source required}/baseer_bwork:/mnt/bwork-addons/baseer_bwork:ro
      - ${BWORK_ORDERS_CANDIDATE_DIR:?Frozen BWork orders source required}/baseer_bwork_procurement:/mnt/bwork-addons/baseer_bwork_procurement:ro
      - ${BWORK_ORDERS_CANDIDATE_DIR:?Frozen BWork orders source required}/baseer_procurement_requests:/mnt/baseer-addons/baseer_procurement_requests:ro
      - ${BWORK_ORDERS_CANDIDATE_DIR:?Frozen BWork orders source required}/baseer_company_setup:/mnt/baseer-addons/baseer_company_setup:ro
