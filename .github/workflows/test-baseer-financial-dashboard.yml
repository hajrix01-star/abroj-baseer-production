name: Test Baseer financial dashboard

on:
  pull_request:
    branches: [main]
    paths:
      - custom_addons/baseer_financial_dashboard/**
      - .github/workflows/test-baseer-financial-dashboard.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  odoo-dashboard-tests:
    name: Odoo 19 financial dashboard tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Stage the exact production profit and loss module
        shell: bash
        run: |
          set -Eeuo pipefail
          production_commit=3c847bffbaa02a61314f3db3b4a7b7dfc59479e4
          git fetch --no-tags --depth=1 origin "$production_commit"
          mkdir -p "$RUNNER_TEMP/production-addons"
          git archive "$production_commit" custom_addons/baseer_profit_loss_report \
            | tar -xf - -C "$RUNNER_TEMP/production-addons" --strip-components=1
          test -f "$RUNNER_TEMP/production-addons/baseer_profit_loss_report/__manifest__.py"
      - name: Install the dashboard against production report and run its contract tests
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network host \
            -e HOST=127.0.0.1 -e USER=odoo -e PASSWORD=odoo \
            --mount type=bind,src="$RUNNER_TEMP/production-addons",dst=/mnt/production-addons,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/custom_addons",dst=/mnt/baseer-addons,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/third_party_addons/erp_heritage_19",dst=/mnt/heritage-addons,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/third_party_addons/odoomates_19",dst=/mnt/payroll-addons,readonly \
            odoo@sha256:f99ffac95cb39a0924622ea4118481c95651d9c84187e5b30a21c2cc4419c7dd \
            odoo --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/production-addons,/mnt/baseer-addons,/mnt/heritage-addons,/mnt/payroll-addons \
            -d baseer_financial_dashboard_ci -i baseer_financial_dashboard --without-demo=all \
            --test-enable --test-tags=/baseer_financial_dashboard \
            --stop-after-init --max-cron-threads=0 --workers=0 --log-level=test

  hoot-dashboard-tests:
    name: Financial dashboard Hoot against production report
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Stage the exact production profit and loss module
        shell: bash
        run: |
          set -Eeuo pipefail
          production_commit=3c847bffbaa02a61314f3db3b4a7b7dfc59479e4
          git fetch --no-tags --depth=1 origin "$production_commit"
          mkdir -p "$RUNNER_TEMP/production-addons"
          git archive "$production_commit" custom_addons/baseer_profit_loss_report \
            | tar -xf - -C "$RUNNER_TEMP/production-addons" --strip-components=1
          test -f "$RUNNER_TEMP/production-addons/baseer_profit_loss_report/__manifest__.py"
      - name: Install pinned Odoo and check headless Chrome
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v google-chrome
          google-chrome --version
          curl --fail --location --silent --show-error \
            https://nightly.odoo.com/19.0/nightly/deb/odoo_19.0.20260926_all.deb \
            --output "$RUNNER_TEMP/odoo_19.0.20260926_all.deb"
          printf '%s  %s\n' cb9d876779edc8d5f0394ddd3936a387e349077c \
            "$RUNNER_TEMP/odoo_19.0.20260926_all.deb" | sha1sum --check
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "$RUNNER_TEMP/odoo_19.0.20260926_all.deb" python3-websocket
      - name: Run the dashboard Hoot suite on desktop and mobile
        shell: bash
        run: |
          set -Eeuo pipefail
          odoo --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo \
            --http-interface=127.0.0.1 --http-port=8079 \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,"$RUNNER_TEMP/production-addons","$GITHUB_WORKSPACE/custom_addons","$GITHUB_WORKSPACE/third_party_addons/erp_heritage_19","$GITHUB_WORKSPACE/third_party_addons/odoomates_19" \
            -d baseer_financial_dashboard_ui_ci -i baseer_financial_dashboard --without-demo=all \
            '--test-tags=/web:WebSuite.test_unit_desktop[@baseer_financial_dashboard/financial_dashboard],/web:MobileWebSuite.test_unit_mobile[@baseer_financial_dashboard/financial_dashboard]' \
            --stop-after-init --max-cron-threads=0 --workers=0 --log-level=test \
            2>&1 | tee "$RUNNER_TEMP/baseer-financial-dashboard-hoot.log"
          test "$(grep -Fc '[HOOT] Test suite succeeded' "$RUNNER_TEMP/baseer-financial-dashboard-hoot.log")" -ge 2
          grep -Fq '[HOOT] Running test "@baseer_financial_dashboard/financial_dashboard/' "$RUNNER_TEMP/baseer-financial-dashboard-hoot.log"
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseer-financial-dashboard-ui-diagnostics
          path: |
            ${{ runner.temp }}/baseer-financial-dashboard-hoot.log
            /tmp/odoo_tests/baseer_financial_dashboard_ui_ci/screenshots/
          retention-days: 7
