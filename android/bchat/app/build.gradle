plugins { id 'com.android.application' }
// Firebase is opt-in: no credentials, SDK, service, or fake push path in local builds.
def bchatFirebaseConfig = file('google-services.json')
def bchatPushEnabled = bchatFirebaseConfig.exists() && project.findProperty('bchatEnablePush') == 'true'
if (bchatPushEnabled) {
 apply plugin: 'com.google.gms.google-services'
}
android {
 buildFeatures { buildConfig true }
 // The app switches languages offline, so future bundles must ship both catalogues.
 bundle { language { enableSplit = false } }
 namespace 'com.baseer.freshchat'
 // AGP 8 requires a package-free input; the standalone manifest supplies its app ID.
 // check-package.py enforces semantic equality between these two manifest inputs.
 sourceSets { main {
  manifest.srcFile bchatPushEnabled ? 'src/gradle/AndroidManifestPush.xml' : 'src/gradle/AndroidManifest.xml'
  if (!bchatPushEnabled) {
   java.exclude '**/BChatFirebaseMessagingService.java'
   java.exclude '**/BChatFirebaseTokenSource.java'
  }
 }; debug {
  if (project.findProperty('bchatEmulatorLocal') == 'true') res.srcDirs += 'src/emulator/res'
 } }
 compileSdk 35
 // Preserve the original brand PNG bytes; do not replace or crunch the B mark.
 aaptOptions { cruncherEnabled = false }
 defaultConfig {
  applicationId 'com.baseer.bchat.preview'; minSdk 26; targetSdk 35
  versionCode 50; versionName '0.7.34-user-permissions'
  buildConfigField 'boolean', 'BCHAT_PUSH_ENABLED', bchatPushEnabled ? 'true' : 'false'
 }
 // Independent preview signer, supplied only through local environment paths.
 // No debug fallback or automatic key generation is permitted.
 def previewKeyPath = System.getenv('BCHAT_SIGNING_KEY')
 def previewPasswordPath = System.getenv('BCHAT_SIGNING_PASSWORD_FILE')
 signingConfigs {
  preview {
   if (previewKeyPath && previewPasswordPath) {
    storeFile file(previewKeyPath)
    storePassword file(previewPasswordPath).text.trim()
    keyAlias 'bchat-preview'
    keyPassword file(previewPasswordPath).text.trim()
   }
  }
 }
 buildTypes {
  debug {
   signingConfig signingConfigs.preview
   // ADB reverse + the local TLS proxy are used only by an explicit emulator build.
   buildConfigField 'String', 'BCHAT_ORIGIN', project.findProperty('bchatEmulatorLocal') == 'true'
      ? '"https://localhost:18443"' : '"https://desktop-cvc68i5.tail938958.ts.net:18444"'
  }
  release {
   signingConfig signingConfigs.preview
   buildConfigField 'String', 'BCHAT_ORIGIN', '"https://desktop-cvc68i5.tail938958.ts.net:18444"'
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
if (bchatPushEnabled) {
 dependencies {
  implementation platform('com.google.firebase:firebase-bom:34.19.0')
  implementation 'com.google.firebase:firebase-messaging'
 }
}
dependencies { implementation 'androidx.recyclerview:recyclerview:1.4.0' }
