name: Test Baseer workspace POS access
on:
  pull_request:
    branches: [main]
    paths:
      - custom_addons/baseer_basser_workspace/**
      - custom_addons/baseer_access_roles/**
      - .github/workflows/test-baseer-workspace.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace-pos-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify branch-manager POS navigation and role isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network host \
            -e HOST=127.0.0.1 -e USER=odoo -e PASSWORD=odoo \
            --mount type=bind,src="$GITHUB_WORKSPACE/custom_addons",dst=/mnt/baseer-addons,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/third_party_addons/erp_heritage_19",dst=/mnt/heritage,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/third_party_addons/odoomates_19",dst=/mnt/payroll,readonly \
            odoo@sha256:f99ffac95cb39a0924622ea4118481c95651d9c84187e5b30a21c2cc4419c7dd \
            odoo --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/baseer-addons,/mnt/heritage,/mnt/payroll \
            -d baseer_workspace_ci -i baseer_basser_workspace --without-demo=all \
            --test-enable \
            --test-tags=/baseer_basser_workspace:BasserWorkspaceCase.test_retired_hidden_target_cannot_be_reactivated_or_opened,/baseer_basser_workspace:BasserWorkspaceCase.test_branch_manager_pos_route_uses_existing_cashier_rights,/baseer_basser_workspace:BasserWorkspaceCase.test_branch_manager_pos_route_preserves_role_and_company_gates,/baseer_basser_workspace:BasserWorkspaceCase.test_branch_manager_role_label_is_distinct_from_pos_cashier,/baseer_basser_workspace:BasserWorkspaceCase.test_basser_t00_pos_cashier_gets_only_the_native_pos_dashboard,/baseer_basser_workspace:BasserWorkspaceCase.test_basser_t01_cashier_gets_only_seeded_shortcuts_and_native_actions,/baseer_basser_workspace:BasserWorkspaceCase.test_basser_t04_company_scope_uses_server_active_company_only,/baseer_basser_workspace:BasserWorkspaceCase.test_branch_manager_advance_review_has_no_accountant_rights \
            --stop-after-init --max-cron-threads=0 --workers=0 --log-level=test 2>&1 | tee workspace-pos.log
          test "$(grep -c 'Starting BasserWorkspaceCase.test_' workspace-pos.log)" -eq 8
          if grep -Eq ': skipped .+ : |[1-9][0-9]* failed,|[1-9][0-9]* error\(s\)' workspace-pos.log; then
            exit 1
          fi
          grep -F '0 failed, 0 error(s)' workspace-pos.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-pos-access
          path: workspace-pos.log
          if-no-files-found: error
