name: Test Baseer report engine

on:
  pull_request:
    branches: [main]
    paths:
      - custom_addons/baseer_report_engine/**
      - custom_addons/baseer_report_engine_tobacco/**
      - custom_addons/baseer_report_engine_vat/**
      - custom_addons/baseer_report_engine_dashboard/**
      - .github/workflows/test-baseer-report-engine.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  odoo-report-tests:
    name: Odoo 19 report engine tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install module and run its Odoo tests in an isolated database
        shell: bash
        run: |
          set -Eeuo pipefail
          MODULES=baseer_report_engine; TAGS=/baseer_report_engine
          if [ -d custom_addons/baseer_report_engine_tobacco ]; then
            MODULES="$MODULES,account_tax_python,baseer_report_engine_tobacco"; TAGS="$TAGS,/baseer_report_engine_tobacco"
          fi
          if [ -d custom_addons/baseer_report_engine_vat ]; then
            MODULES="$MODULES,baseer_report_engine_vat"; TAGS="$TAGS,/baseer_report_engine_vat"
          fi
          if [ -d custom_addons/baseer_report_engine_dashboard ]; then
            MODULES="$MODULES,baseer_report_engine_dashboard"; TAGS="$TAGS,/baseer_report_engine_dashboard"
          fi
          docker run --rm --network host \
            -e HOST=127.0.0.1 -e USER=odoo -e PASSWORD=odoo \
            --mount type=bind,src="$GITHUB_WORKSPACE/custom_addons",dst=/mnt/baseer-addons,readonly \
            odoo@sha256:f99ffac95cb39a0924622ea4118481c95651d9c84187e5b30a21c2cc4419c7dd \
            odoo --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/baseer-addons \
            -d baseer_report_engine_ci -i "$MODULES" --without-demo=all \
            --test-enable --test-tags="$TAGS" \
            --stop-after-init --max-cron-threads=0 --workers=0 --log-level=test
