name: Test Baseer payroll settlement UI

on:
  pull_request:
    branches: [main]
    paths:
      - custom_addons/baseer_payroll/**
      - .github/workflows/test-baseer-payroll-settlement-ui.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payroll-settlement-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the runner's headless Chrome
        run: google-chrome --version
      - name: Install the pinned Odoo 19 package
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --silent --show-error \
            https://nightly.odoo.com/19.0/nightly/deb/odoo_19.0.20260926_all.deb \
            --output "$RUNNER_TEMP/odoo_19.0.20260926_all.deb"
          printf '%s  %s\n' \
            cb9d876779edc8d5f0394ddd3936a387e349077c \
            "$RUNNER_TEMP/odoo_19.0.20260926_all.deb" | sha1sum --check
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "$RUNNER_TEMP/odoo_19.0.20260926_all.deb" python3-websocket
          npm install --global rtlcss@4.3.0
          rtlcss --version
      - name: Confirm split payroll in English desktop and Arabic mobile browsers
        shell: bash
        run: |
          set -Eeuo pipefail
          odoo --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo \
            --http-interface=127.0.0.1 --http-port=8079 \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,"$GITHUB_WORKSPACE/custom_addons","$GITHUB_WORKSPACE/third_party_addons/odoomates_19","$GITHUB_WORKSPACE/third_party_addons/erp_heritage_19" \
            -d baseer_payroll_ui_ci -i l10n_sa,baseer_payroll --without-demo=all \
            '--test-tags=/baseer_payroll:PayrollSplitSettlementDesktop,/baseer_payroll:PayrollSplitSettlementMobile' \
            --stop-after-init --max-cron-threads=0 --workers=0 --log-level=test \
            2>&1 | tee "$RUNNER_TEMP/baseer-payroll-ui.log"
          grep -Fq 'PAYROLL_SPLIT_UI_PASS en_US 1440' "$RUNNER_TEMP/baseer-payroll-ui.log"
          grep -Fq 'PAYROLL_SPLIT_UI_PASS ar_001 375' "$RUNNER_TEMP/baseer-payroll-ui.log"
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseer-payroll-ui-diagnostics
          path: |
            ${{ runner.temp }}/baseer-payroll-ui.log
            /tmp/odoo_tests/baseer_payroll_ui_ci/screenshots/
          retention-days: 7
