name: Test BWork administration and private push in isolated Odoo
on:
  pull_request:
    branches: [main]
    paths:
      - 'custom_addons/baseer_bwork_admin/**'
      - 'custom_addons/baseer_bchat/**'
      - '.github/workflows/test-bwork-admin.yml'
permissions:
  contents: read
jobs:
  admin-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Native admin authority, exact metadata and BWork outbound privacy
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network host \
            -e HOST=127.0.0.1 -e USER=odoo -e PASSWORD=odoo \
            -e PGOPTIONS='-c lock_timeout=5000 -c statement_timeout=30000' \
            --mount type=bind,src="$GITHUB_WORKSPACE/custom_addons",dst=/mnt/baseer-addons,readonly \
            odoo@sha256:f99ffac95cb39a0924622ea4118481c95651d9c84187e5b30a21c2cc4419c7dd \
            odoo --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/baseer-addons \
            -d bwork_admin_ci -i baseer_bchat,baseer_bwork_admin --without-demo=all \
            --test-enable \
            --test-tags=/baseer_bwork_admin:BWorkAdminCase,/baseer_bwork_admin:BWorkAdminHttpCase,/baseer_bchat:BWorkPushPrivacyCase \
            --stop-after-init --max-cron-threads=0 --workers=0 --log-level=test 2>&1 | tee bwork-admin-runtime.log
          for test_class in BWorkAdminCase BWorkAdminHttpCase BWorkPushPrivacyCase; do
            grep -F "Starting $test_class." bwork-admin-runtime.log
          done
          if grep -Eq ': skipped .+ : |[1-9][0-9]* failed,|[1-9][0-9]* error\(s\)' bwork-admin-runtime.log; then
            echo 'BWork administration runtime tests were skipped or failed' >&2
            exit 1
          fi
          grep -F '0 failed, 0 error(s)' bwork-admin-runtime.log
          test "$(grep -Ec 'Starting (BWorkAdminCase|BWorkAdminHttpCase|BWorkPushPrivacyCase)\.' bwork-admin-runtime.log)" -eq 16
      - name: Preserve isolated runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bwork-admin-runtime
          path: bwork-admin-runtime.log
          if-no-files-found: error
