# This file belongs under Nginx's http context (for example conf.d/). It is a
# dedicated vhost for this compose project; it never proxies to another app.
map $http_upgrade $baseer_connection_upgrade {
    default upgrade;
    '' close;
}

upstream baseer_odoo_upstream {
    server 127.0.0.1:18069;
    keepalive 32;
}

upstream baseer_odoo_websocket_upstream {
    server 127.0.0.1:18072;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name abroj.sa www.abroj.sa baseer.abroj.sa;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name abroj.sa www.abroj.sa baseer.abroj.sa;

    ssl_certificate /etc/letsencrypt/live/abroj.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abroj.sa/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Odoo serves its client bundles through the application.  Compressing
    # proxied text responses here keeps this optimisation scoped to Baseer
    # while leaving the other sites on this host untouched.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/xml application/xml+rss image/svg+xml
               font/ttf font/otf application/vnd.ms-fontobject;

    if ($host = www.abroj.sa) {
        return 301 https://abroj.sa$request_uri;
    }

    location ^~ /web/database {
        return 404;
    }

    location /websocket {
        proxy_pass http://baseer_odoo_websocket_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $baseer_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 720s;
    }

    location / {
        proxy_pass http://baseer_odoo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 720s;
        proxy_send_timeout 720s;
    }
}
