services:
  procurement_qa:
    image: odoo@sha256:f99ffac95cb39a0924622ea4118481c95651d9c84187e5b30a21c2cc4419c7dd
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
    command: ["odoo", "--config=/etc/odoo/odoo.local.conf", "--addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/baseer-addons,/mnt/third-party-addons/erp_heritage_19,/mnt/third-party-addons/odoomates_19", "--database=baseer_procurement_qa_20260911", "--db-filter=^baseer_procurement_qa_20260911$", "--no-database-list", "--max-cron-threads=0", "--limit-time-real=0"]
    ports: ["127.0.0.1:18081:8069"]
    volumes:
      - ./config/odoo.local.conf:/etc/odoo/odoo.local.conf:ro
      - ./custom_addons:/mnt/baseer-addons:ro
      - ./.local-backups/90day-repair-20260910/candidate-r2/third_party_addons:/mnt/third-party-addons:ro
      - procurement_qa_data:/var/lib/odoo
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/login', timeout=4).read(1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: unless-stopped

volumes:
  procurement_qa_data:
