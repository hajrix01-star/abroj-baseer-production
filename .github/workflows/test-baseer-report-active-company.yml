name: Test Baseer report active-company UI

on:
  pull_request:
    branches: [main]
    paths:
      - custom_addons/baseer_account_activity/**
      - custom_addons/baseer_pos_tobacco_report/**
      - .github/workflows/test-baseer-report-active-company.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-tests:
    name: Odoo 19 ${{ matrix.module }} tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: baseer_account_activity
            suite: account_activity
          - module: baseer_pos_tobacco_report
            suite: tobacco_report
    services:
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Odoo 19 and Chrome test dependency
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v google-chrome
          curl --fail --location --silent --show-error \
            https://nightly.odoo.com/19.0/nightly/deb/odoo_19.0.20260926_all.deb \
            --output "$RUNNER_TEMP/odoo_19.0.20260926_all.deb"
          printf '%s  %s\n' \
            cb9d876779edc8d5f0394ddd3936a387e349077c \
            "$RUNNER_TEMP/odoo_19.0.20260926_all.deb" | sha1sum --check
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "$RUNNER_TEMP/odoo_19.0.20260926_all.deb" python3-websocket
          odoo --version
      - name: Run focused backend and desktop/mobile Hoot tests
        shell: bash
        env:
          MODULE: ${{ matrix.module }}
          SUITE: ${{ matrix.suite }}
        run: |
          set -Eeuo pipefail
          odoo --db_host=127.0.0.1 --db_port=5432 \
            --db_user=odoo --db_password=odoo \
            --http-interface=127.0.0.1 --http-port=8079 \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,"$GITHUB_WORKSPACE/custom_addons" \
            -d "${MODULE}_ui_ci" -i "$MODULE" --without-demo=all \
            --test-tags="/$MODULE,/web:WebSuite.test_unit_desktop[@$MODULE/$SUITE],/web:MobileWebSuite.test_unit_mobile[@$MODULE/$SUITE]" \
            --stop-after-init --max-cron-threads=0 --workers=0 --log-level=test \
            2>&1 | tee "$RUNNER_TEMP/${MODULE}-ui.log"
          test "$(grep -Fc '[HOOT] Test suite succeeded' "$RUNNER_TEMP/${MODULE}-ui.log")" -ge 2
          grep -Fq "[HOOT] Running test \"@$MODULE/$SUITE/" "$RUNNER_TEMP/${MODULE}-ui.log"
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-ui-diagnostics
          path: |
            ${{ runner.temp }}/${{ matrix.module }}-ui.log
            /tmp/odoo_tests/${{ matrix.module }}_ui_ci/screenshots/
          retention-days: 7
