# Local BWork clone only. Layer after the orders-route overlay.
# Freeze these five add-ons from the reviewed Git commit before startup.
services:
  odoo:
    command: >-
      odoo --config=/etc/odoo/odoo.conf
      --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/baseer-addons,/mnt/bwork-addons,/mnt/bwork-permission-guards,/mnt/oca-dms,/mnt/third-party-addons/erp_heritage_19,/mnt/third-party-addons/odoomates_19
      --database=baseer_bwork_local --db-filter=^baseer_bwork_local$$
      --no-database-list --max-cron-threads=1 --http-port=8069 --proxy-mode
    volumes:
      - ${BWORK_PERMISSIONS_CANDIDATE_DIR:?Frozen BWork permissions source required}/baseer_bwork:/mnt/bwork-addons/baseer_bwork:ro
      - ${BWORK_PERMISSIONS_CANDIDATE_DIR:?Frozen BWork permissions source required}/baseer_bwork_procurement:/mnt/bwork-addons/baseer_bwork_procurement:ro
      - ${BWORK_PERMISSIONS_CANDIDATE_DIR:?Frozen BWork permissions source required}/baseer_procurement_requests:/mnt/baseer-addons/baseer_procurement_requests:ro
      - ${BWORK_PERMISSIONS_CANDIDATE_DIR:?Frozen BWork permissions source required}/baseer_bwork_permission_guards:/mnt/bwork-permission-guards/baseer_bwork_permission_guards:ro
      - ${BWORK_PERMISSIONS_CANDIDATE_DIR:?Frozen BWork permissions source required}/baseer_bwork_document_permission_guards:/mnt/bwork-permission-guards/baseer_bwork_document_permission_guards:ro
